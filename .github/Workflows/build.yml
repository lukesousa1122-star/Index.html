name: Build iOS IPA Without PC

on:
  push:
    branches: [ main ]

jobs:
  build-ios:
    runs-on: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Capacitor & Dependencies
        run: |
          npm init -y
          npm install @capacitor/core @capacitor/cli @capacitor/ios
          npx cap init App com.spectre.app --web-dir www

      - name: Move Web Files
        run: |
          mkdir www
          mv index.html www/index.html
          npx cap add ios
          npx cap sync ios

      - name: Build Xcode Project Archive
        run: |
          cd ios/App
          xcodebuild -workspace App.xcworkspace -scheme App -configuration Release -destination "generic/platform=iOS" -archivePath $PWD/build/App.xcarchive archive CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO

      - name: Package Unsigned IPA
        run: |
          cd ios/App/build/App.xcarchive/Products/Applications
          mkdir Payload
          mv App.app Payload/
          zip -r App-Unsigned.ipa Payload
          mkdir -p ../../../../../output
          mv App-Unsigned.ipa ../../../../../output/

      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: iOS-Spoofer-IPA
          path: output/App-Unsigned.ipa
